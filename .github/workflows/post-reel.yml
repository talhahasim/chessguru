name: Post chess reel

on:
  schedule:
    # Posts are normally triggered on time by the pre-post review Routine (~16:00 / ~23:00 UTC).
    # These GitHub schedules are only a late FALLBACK (GitHub often starts them 1-3 h late anyway);
    # post-reel.ts skips the run when something was already posted in the last MIN_GAP_HOURS: 9 h for these
    # fallback runs, so a run that starts hours late can't add a third post on a day the Routine already covered
    # (Routine slots ~15:45 / ~22:40 UTC are 7 h and 17 h apart); 5 h for manual / Routine dispatches.
    - cron: "17 18 * * *"
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only render and print the caption (no upload, no post)"
        type: boolean
        default: true
      lesson:
        description: "Force a lesson id (e.g. scholars-mate). Empty = next unposted one."
        type: string
        required: false

concurrency:
  group: post-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      # Scheduled runs post unless the repository variable POSTING_PAUSED is "true"
      # (Settings → Secrets and variables → Actions → Variables). Manual runs always work.
      - name: Check configuration
        id: cfg
        env:
          IG: ${{ secrets.IG_ACCESS_TOKEN }}
          SB: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PAUSED: ${{ vars.POSTING_PAUSED }}
          EVENT: ${{ github.event_name }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$IG" ] || [ -z "$SB" ]; then
            echo "::notice::Instagram/Supabase secrets are not set yet, skipping."
          elif [ "$EVENT" = "schedule" ] && [ "$PAUSED" = "true" ]; then
            echo "::notice::Scheduled posting is paused (repository variable POSTING_PAUSED=true)."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.cfg.outputs.ok == 'true'

      - name: Install Chrome dependencies for Remotion
        if: steps.cfg.outputs.ok == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - run: npx remotion browser ensure
        if: steps.cfg.outputs.ok == 'true'

      - name: Check lessons (moves, Stockfish analysis, voiceover)
        if: steps.cfg.outputs.ok == 'true'
        run: npm run validate

      - name: Render and post
        if: steps.cfg.outputs.ok == 'true'
        run: npx tsx scripts/post-reel.ts
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          LESSON: ${{ inputs.lesson }}
          MIN_GAP_HOURS: ${{ github.event_name == 'schedule' && '9' || '5' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Keep the rendered video as a build artifact
        if: always() && steps.cfg.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/
          retention-days: 3
          if-no-files-found: ignore
